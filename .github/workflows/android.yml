name: Construir APK

on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - "*.gradle"
      - "gradle/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          VERSION=$(grep -oP "versionName '\\K[^']+" app/build.gradle)
          echo "APK=ControlHisense-v${VERSION}.apk" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "ControlHisense-v${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ControlHisense-apk
          path: ${{ env.APK }}

      - name: Publicar descarga (release "latest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$APK" \
            --title "Control Hisense (última versión)" \
            --notes "APK generado automáticamente desde ${GITHUB_SHA::7}. Descárguelo desde el celular e instálelo." \
            --target "$GITHUB_SHA" --prerelease
