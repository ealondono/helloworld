plugins {
    id 'com.android.application'
}

android {
    namespace 'co.ealondono.hisenseremote'
    compileSdk 35

    defaultConfig {
        applicationId 'co.ealondono.hisenseremote'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Firmado con la llave de debug para poder instalarlo directamente (uso personal).
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Cliente MQTT (Eclipse Paho, EPL/EDL) para televisores Hisense VIDAA.
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
}
